<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,800;1,900&display=swap" rel="stylesheet">
<style>
  :root{--noir:#0B0B0C;--anthra:#1A1A1D;--rouge:#E3182D;--blanc:#FFFFFF;--gris:#9A9AA2}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:Inter,Roboto,sans-serif;color:var(--blanc);min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%,rgba(227,24,45,.22),transparent 55%),
      repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 1px,transparent 1px 22px),
      var(--noir);
    display:flex;justify-content:center;padding:44px 16px 32px;
  }
  main{width:100%;max-width:440px;text-align:center}
  .logo{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;border:3px solid var(--rouge);
    background:var(--anthra);display:flex;align-items:center;justify-content:center;
    font-weight:900;font-style:italic;font-size:30px;overflow:hidden}
  .logo img{width:100%;height:100%;object-fit:cover}
  .brand{mix-blend-mode:lighten;display:block;width:78%;max-width:300px;height:auto;margin:0 auto 4px}
  h1{font-weight:900;font-style:italic;font-size:30px;line-height:.95}
  h1 span{color:var(--rouge)}
  .bio{color:var(--gris);font-size:15px;margin:12px 0 18px;line-height:1.45}
  .socials{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:26px}
  .socials a{color:var(--blanc);text-decoration:none;font-weight:600;font-size:13px;
    border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:7px 13px}
  .socials a:hover{border-color:var(--rouge)}
  h2{font-weight:900;font-style:italic;font-size:13px;letter-spacing:3px;color:var(--gris);
    text-align:left;margin:22px 0 10px}
  .btn{display:block;text-decoration:none;color:var(--blanc);background:var(--anthra);
    border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:15px 18px;margin-bottom:10px;
    text-align:left;transition:transform .12s,border-color .12s;width:100%;font:inherit;cursor:pointer}
  a.btn:hover,a.btn:active,button.btn:hover{transform:scale(.98);border-color:var(--rouge)}
  .btn strong{display:block;font-weight:800;font-size:16px}
  .btn small{color:var(--gris);font-size:13px}
  .top{background:var(--rouge);border-color:var(--rouge)}
  .top small{color:rgba(255,255,255,.85)}
  .soon{opacity:.45;cursor:default;pointer-events:none}
  .badge{display:inline-block;background:var(--rouge);font-size:11px;font-weight:800;padding:2px 7px;margin-left:6px;vertical-align:middle}
  .soon .badge{background:var(--gris);color:var(--noir)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--rouge);
    padding:10px 16px;border-radius:10px;font-weight:800;font-size:14px;opacity:0;transition:opacity .2s}
  .toast.on{opacity:1}
  footer{color:var(--gris);font-size:12px;letter-spacing:4px;font-weight:800;margin-top:28px}
  footer span{color:var(--rouge)}
</style>
</head>

  <p class="bio">Ouvrier le jour, à la salle le soir.<br>Papa, prise de masse avec peu de temps.</p>

  <div class="socials" id="socials"></div>
  <div id="liens"></div>

  <footer>RB <span>NUTRITION</span></footer>
</main>
<div class="toast" id="toast"></div>

<script src="tableur.js"></script>
<script>
/* =========================================================
   TES LIENS — c'est la seule partie à modifier.
   - Mets l'adresse entre les guillemets de "lien".
   - Si "lien" est vide (""), le bouton s'affiche grisé « Bientôt ».
   ========================================================= */

const RESEAUX = [
  { nom: "Instagram", lien: "https://www.instagram.com/rb.nutrition.muscu/" },
  { nom: "TikTok",    lien: "https://www.tiktok.com/@rbmuscu" },
  { nom: "YouTube",   lien: "https://www.youtube.com/@RBNutritionMuscu" },
  { nom: "Facebook",  lien: "https://www.facebook.com/share/1betZ6Lrrf/" },
  { nom: "Snapchat",  lien: "https://snapchat.com/t/jhSDZCci" },
  { nom: "LinkedIn",  lien: "https://lnkd.in/p/esEuwgmx" }
];

const SECTIONS = [
  { titre: "GRATUIT", boutons: [
    { emoji:"🧮", texte:"Calcule tes calories et protéines", sous:"Outil gratuit, 30 secondes",
      lien:"https://rbnutrition.github.io/" },
    { emoji:"📊", texte:"Tableur suivi prise de masse", sous:"À télécharger · Excel, Google Sheets, Numbers",
      lien:"#", action:"tableur" }
  ]},
  { titre: "MES PRODUITS", boutons: [
    { emoji:"📘", texte:"Guide prise de masse", sous:"Dispo sur Amazon", lien:"https://amzn.eu/d/0c4g9BZ2" },
    { emoji:"📗", texte:"Guide perte de poids", sous:"Dispo sur Amazon", lien:"https://amzn.eu/d/0iKKT7cQ" }
  ]},
  { titre: "MES BONS PLANS", boutons: [
    { emoji:"💊", texte:"-10 % chez VitaStrong", code:"RBN76",
      sous:"Partenariat · code appliqué automatiquement",
      lien:"https://vitastrong.fr/?coupon=RBN76" }
  ]},
  { titre: "TRAVAILLER AVEC MOI", boutons: [
    { emoji:"🤝", texte:"Collab / partenariat marque", sous:"Écris-moi par e-mail",
      lien:"mailto:romuald.boudan76@gmail.com?subject=Collab%20RB%20NUTRITION" }
  ]}
];

/* ========= Ne touche pas en dessous ========= */
const toast = t => { const e=document.getElementById('toast'); e.textContent=t; e.classList.add('on'); setTimeout(()=>e.classList.remove('on'),1800); };

const soc = document.getElementById('socials');
RESEAUX.filter(r => r.lien).forEach(r => {
  const a = document.createElement('a'); a.href=r.lien; a.target="_blank"; a.rel="noopener"; a.textContent=r.nom; soc.appendChild(a);
});

const zone = document.getElementById('liens');
SECTIONS.forEach(s => {
  const h = document.createElement('h2'); h.textContent = s.titre; zone.appendChild(h);
  s.boutons.forEach(b => {
    const pret = !!b.lien;
    const a = document.createElement('a');
    a.className = 'btn' + (b.principal ? ' top' : '') + (pret ? '' : ' soon');
    if (pret) { a.href=b.lien; if(!b.action && !b.lien.startsWith('mailto:')){a.target="_blank"; a.rel="noopener";} }
    if (b.action === 'tableur') a.onclick = e => { e.preventDefault(); rbTelecharger(a); };
    a.innerHTML = `<strong>${b.emoji} ${b.texte}${b.code?` <span class="badge">${b.code}</span>`:''}${pret?'':' <span class="badge">BIENTÔT</span>'}</strong><small>${b.sous}</small>`;
    zone.appendChild(a);
    if (b.code && pret) {
      const c = document.createElement('button'); c.className='btn';
      c.innerHTML = `<strong>📋 Copier le code ${b.code}</strong><small>Pour le coller au paiement</small>`;
      c.onclick = () => { try{ navigator.clipboard.writeText(b.code); toast('Code '+b.code+' copié !'); }catch(e){ toast('Code : '+b.code); } };
      zone.appendChild(c);
    }
  });
});

/* Bouton partager */
const p = document.createElement('button'); p.className='btn';
p.innerHTML = '<strong>📤 Partager à un pote qui fait de la muscu</strong><small>Envoie-lui cette page</small>';
p.onclick = async () => {
  const url = location.href;
  try { if (navigator.share) { await navigator.share({title:'RB NUTRITION', url}); }
        else { await navigator.clipboard.writeText(url); toast('Lien copié !'); } }
  catch(e){}
};
zone.appendChild(p);
</script>
</body>
